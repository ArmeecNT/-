name: Build static TOPSTANKI mirror
on:
  push:
    branches: [topstanki-clone]
    paths:
      - mirror_site.py
      - requirements.txt
      - .github/workflows/topstanki-mirror.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topstanki-clone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Mirror public pages
        run: python mirror_site.py
      - name: Commit generated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror index.html
          git diff --cached --quiet || (git commit -m "Generate public static mirror" && git push)
